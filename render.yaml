# Render Blueprint for the API. The web app deploys to Vercel (root directory: apps/web)
# and proxies /api/* here, so no CORS configuration is needed.
services:
  - type: web
    name: salary-management-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AUTH_USERNAME
        sync: false # the HR Manager's login, e.g. hr.manager
      - key: AUTH_PASSWORD_HASH
        sync: false # pnpm --filter @salary/api auth:hash-password
      - key: SESSION_SECRET
        generateValue: true
    # A persistent disk keeps edits across deploys (requires a paid instance).
    # Without it the container reseeds the same deterministic 10k employees on each deploy.
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
